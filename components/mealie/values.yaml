replicaCount: 1

image:
  repository: ghcr.io/mealie-recipes/mealie
  pullPolicy: IfNotPresent
  tag: "@sha256:8b02290f4d1806f02acac6f25f6d48a3c965612fda1f8e914d5af533276f8688"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mealie.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# SQLite is the default — set enabled: true and fill credentials for Postgres
postgres:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Persist /app/data (SQLite database + uploaded images)
volumes:
  - name: data
    persistentVolumeClaim:
      claimName: mealie-data

volumeMounts:
  - name: data
    mountPath: /app/data
